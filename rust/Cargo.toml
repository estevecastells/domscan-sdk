[package]
name = "domscan-sdk"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for the DomScan API"
readme = "README.md"
repository = "https://github.com/estevecastells/domscan-sdk"
homepage = "https://domscan.net/docs"
documentation = "https://domscan.net/docs"
keywords = ["domain", "dns", "whois", "security", "api"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
urlencoding = "2"
tokio = { version = "1", features = ["rt", "macros"] }
