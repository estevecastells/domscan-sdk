name: Publish SDK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install build
      - name: Build release assets
        env:
          DOMSCAN_SDK_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DOMSCAN_SDK_VERSION="${DOMSCAN_SDK_VERSION#v}"
          mkdir release

          (
            cd node
            npm ci
            npm pack --pack-destination "$GITHUB_WORKSPACE/release"
          )
          cp "release/domscan-sdk-${DOMSCAN_SDK_VERSION}.tgz" release/domscan-sdk-node.tgz

          python -m build --outdir release python
          cp "release/domscan_sdk-${DOMSCAN_SDK_VERSION}.tar.gz" release/domscan-sdk-python.tar.gz

          (
            cd ruby
            gem build domscan-sdk.gemspec
          )
          mv "ruby/domscan-sdk-${DOMSCAN_SDK_VERSION}.gem" release/
          cp "release/domscan-sdk-${DOMSCAN_SDK_VERSION}.gem" release/domscan-sdk-ruby.gem

          cp -R php release/php-package
          composer config --working-dir=release/php-package version "$DOMSCAN_SDK_VERSION"
          (
            cd release/php-package
            zip -qr ../domscan-sdk-php.zip .
          )
          rm -rf release/php-package

          mvn --batch-mode --file java/pom.xml package
          cp "java/target/domscan-sdk-java-${DOMSCAN_SDK_VERSION}.jar" release/

          dotnet pack csharp/DomScan.SDK.csproj --configuration Release --output release

          gradle -p kotlin build
          cp "kotlin/build/libs/domscan-sdk-kotlin-${DOMSCAN_SDK_VERSION}.jar" release/

          cargo package --manifest-path rust/Cargo.toml --allow-dirty
          cp "target/package/domscan-sdk-${DOMSCAN_SDK_VERSION}.crate" release/

          (
            cd release
            sha256sum * > SHA256SUMS
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --title "DomScan SDK $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
