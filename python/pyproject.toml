[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domscan-sdk"
version = "0.2.0"
description = "Official Python SDK for the DomScan Domain Intelligence API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "DomScan", email = "support@domscan.net" }
]
keywords = ["domscan", "dns", "whois", "domain intelligence", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://domscan.net/docs"
Repository = "https://github.com/estevecastells/domscan-sdk"
Issues = "https://github.com/estevecastells/domscan-sdk/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
